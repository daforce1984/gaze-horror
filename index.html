<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="build" content="2026-09-29-perf3-js">
<meta name="description" content="응시 — 의자에 묶인 채 귀신을 응시해 단서를 찾는 WebGPU 3D 공포 퍼즐 게임" data-en-content="THE GAZE — a WebGPU 3D horror puzzle game: tied to a chair, you stare down a ghost to find the clues">
<title data-en-title="THE GAZE — 응시">응시 — THE GAZE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&family=Nanum+Pen+Script&family=Crimson+Pro:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/lang.js"></script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div class="top">
    <button id="pauseBtn" class="icon" aria-label="일시정지" data-en-aria="Pause">Ⅱ</button>
    <button id="memoBtn" class="icon memo" aria-label="메모" data-en-aria="Notes" data-en="Notes">메모</button>
    <button id="gyroBtn" class="icon gyro" aria-label="자이로 센서" data-en-aria="Gyro sensor" aria-pressed="false" data-en="📱 Gyro">📱 자이로</button>
    <div id="objective"></div>
    <div class="meters">
      <div class="warmbox" aria-label="온기" data-en-aria="Warmth"><span>❄</span><div class="warm"><i id="warmFill"></i></div></div>
      <div class="fearbox" aria-label="공포" data-en-aria="Fear"><span>♥</span><div class="fear"><i id="fearFill"></i></div></div>
    </div>
  </div>
  <div id="cross"></div>
  <svg id="revealRing" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="bg"/><circle id="revealArc" cx="22" cy="22" r="18" class="fg"/></svg>
  <div id="subtitle"></div>
  <div id="hint"></div>
  <div id="tray"></div>
  <button id="actionBtn"></button>
 <button id="turnBtn" aria-label="뒤돌아보기" data-en-aria="Turn around" data-en="↻<small>Turn around</small>">↻<small>뒤돌아보기</small></button>
  <div id="hsTip"></div>
  <div id="hotbar"><button id="torchBtn" class="slot" aria-label="손전등" data-en-aria="Flashlight" aria-pressed="false" data-en="<b>🔦</b><small>Flashlight</small>"><b>🔦</b><small>손전등</small></button><span class="gap"></span><button id="remoteBtn" class="slot" aria-label="리모컨" data-en-aria="Remote" data-en="<b>📺</b><small>Remote</small>"><b>📺</b><small>리모컨</small></button></div>
  <div id="anMark"><i></i><span></span></div>
  <div id="tapFx"><b></b><span></span></div>
  <div id="knockTrack"><i class="head"></i></div>
  <div id="anHud" aria-label="이상현상" data-en-aria="Anomalies"><span class="pips"><i></i><i></i><i></i></span><b id="anCount"></b></div>
  <div id="choice"><button id="chGive" class="primary" data-en="Give the photo<small>Let her go</small>">사진 건네기<small>그 애를 놓아준다</small></button><button id="chStay" class="ghostbtn" data-en="Stay with her<small>Remain here, together</small>">곁에 남기<small>함께 여기에 남는다</small></button></div>
  <button id="zoomBtn" aria-label="확대해서 응시" data-en-aria="Zoom in and gaze" data-en="👁<small>Gaze</small>">👁<small>응시</small></button>
</div>

<div id="lids"><i class="top"></i><i class="bot"></i></div>
<div id="modal"><div id="modalCard" class="card"></div></div>
<div id="inspect">
  <div class="ihead"><b id="inspTitle"></b><span id="inspDesc"></span></div>
  <div id="hotspots"></div>
  <div class="ibar"><button id="inspUse" class="primary" data-en="Use">사용</button><button id="inspClose" class="ghostbtn" data-en="Put down">내려놓기</button></div>
</div>
<div id="pad">
  <div class="padtop"><span data-en="📺 Remote">📺 리모컨</span><b id="padCh">--</b><button id="padClose">✕</button></div>
  <div class="padgrid">
    <button data-p="power" class="pw">⏻</button><button data-p="up">CH ▲</button><button data-p="down">CH ▼</button>
    <button data-p="1">1</button><button data-p="2">2</button><button data-p="3">3</button><button data-p="4">4</button><button data-p="5">5</button><button data-p="6">6</button><button data-p="7">7</button><button data-p="8">8</button><button data-p="9">9</button><button data-p="10">10</button><button data-p="11">11</button><button data-p="12">12</button>
  </div>
</div>
<div id="halluc"></div>
<div id="cctvOsd"><div class="rec"><i>●</i> REC</div><div class="cam">CAM 1 · 303</div><div class="back" data-en="Tap the screen again to come back">화면을 한 번 더 누르면 돌아온다</div></div>
<div id="scare"><img src="assets/ghost_face.webp" alt=""></div>
<div id="fade"></div>
<div id="ending"></div>

<section id="title">
  <div class="bg"></div>
  <div class="inner">
    <p class="room" data-en="Room 303">303호</p>
    <h1 data-en="THE GAZE">응시</h1>
    <p class="en" data-en="응시">THE GAZE</p>
    <p class="lead" data-en="You wake up tied to a chair.<br>You can't stand. You can only look.<br>Whatever she shows you — keep staring, to the very end.">의자에 묶인 채 눈을 떴다.<br>일어설 수 없다. 볼 수만 있다.<br>그 애가 보여주는 것을 — 끝까지 응시하라.</p>
    <button id="startBtn" class="primary" disabled data-en="Enter">들어가기</button>
    <p id="loadText" data-en="Loading…">불러오는 중…</p>
    <ul class="how">
      <li data-en="<b>Drag</b> look around"><b>드래그</b> 둘러보기</li>
      <li data-en="<b>👁 hold · pinch · right-click · wheel</b> zoom"><b>👁 길게 · 두 손가락 · 우클릭 · 휠</b> 확대</li>
      <li data-en="<b>Tap · click</b> examine"><b>탭 · 클릭</b> 살펴보기</li>
      <li class="gyrotip" data-en="<b>📱 Gyro</b> move your phone to look around"><b>📱 자이로</b> 폰을 움직여 둘러보기</li>
    </ul>
    <div class="gfx langsel" role="group" aria-label="Language / 언어"><button data-lang="ko" lang="ko">한국어</button><button data-lang="en" lang="en">English</button></div>
  </div>
</section>

<div id="nogpu"><h2 data-en="WebGPU is not available">WebGPU를 사용할 수 없습니다</h2><p data-en="Please use the latest Chrome / Edge (desktop · Android) or Safari 26 or later.">최신 Chrome / Edge (데스크톱·안드로이드) 또는 Safari 26 이상에서 실행해 주세요.</p></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
